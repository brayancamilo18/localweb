name: Deploy

on:
  push:
    branches: [main, pre, des]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Determinar entorno
        id: env
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "name=prod" >> "$GITHUB_OUTPUT" ;;
            pre)  echo "name=pre"  >> "$GITHUB_OUTPUT" ;;
            des)  echo "name=des" >> "$GITHUB_OUTPUT" ;;
          esac

      # El script en el VPS (/var/www/onez/deploy.sh) hace git pull, build front,
      # composer, migrate y reload. Debe ejecutarse como root o con sudo NOPASSWD.
      # Configuración una vez en el servidor: scripts/setup-vps-github-deploy.sh
      - name: Deploy en VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            ENV="${{ steps.env.outputs.name }}"
            DEPLOY="/var/www/onez/deploy.sh"
            if [ ! -f "$DEPLOY" ]; then
              echo "No existe $DEPLOY"
              exit 1
            fi
            if [ "$(id -u)" -eq 0 ]; then
              bash "$DEPLOY" "$ENV"
            else
              sudo -n bash "$DEPLOY" "$ENV"
            fi
