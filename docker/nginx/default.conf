map $host $tenant_subdomain {
    default "";
    ~^(?<subdomain>[^.]+)\..+$ $subdomain;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 64M;

    root /var/www/html/public;
    index index.php index.html;

    # CORS lo gestiona Laravel (config/cors.php + HandleCors), incl. preflight OPTIONS.

    location /api {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        fastcgi_param HTTP_X_TENANT_SUBDOMAIN $tenant_subdomain;
        fastcgi_read_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}

server {
    listen 5173;
    server_name localhost;

    client_max_body_size 64M;

    location ^~ /templates/ {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        proxy_pass http://front:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://front:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name _;

    add_header Access-Control-Allow-Origin http://localhost:5173 always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept, Origin" always;

    if ($host = localhost) {
        return 404;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Subdomain $tenant_subdomain;
        proxy_pass http://php:8000;
    }
}
