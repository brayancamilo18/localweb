name: Deploy

on:
  push:
    branches: [main, pre, des]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build frontend (CI)
        run: |
          cd front
          npm ci
          npm run build

      - name: Verificar artefacto frontend
        run: test -f front/dist/index.html

      - name: Determinar entorno
        id: env
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "name=prod" >> "$GITHUB_OUTPUT" ;;
            pre)  echo "name=pre"  >> "$GITHUB_OUTPUT" ;;
            des)  echo "name=des"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: SSH y deploy (backend + servidor)
        id: deploy
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            ENV="${{ steps.env.outputs.name }}"
            if ! sudo /var/www/onez/deploy.sh "$ENV"; then
              echo "deploy.sh falló; intentando build-frontend.sh con Node moderno..."
              REPO="/var/www/onez/${ENV}"
              if [ -f "${REPO}/scripts/build-frontend.sh" ]; then
                sudo bash "${REPO}/scripts/build-frontend.sh"
              else
                exit 1
              fi
            fi

      - name: Preparar carpeta dist en el VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            ENV="${{ steps.env.outputs.name }}"
            DIST="/var/www/onez/${ENV}/front/dist"
            sudo mkdir -p "$DIST"
            sudo chown -R "$(whoami):$(whoami)" "/var/www/onez/${ENV}/front"
            chmod -R u+rwX "/var/www/onez/${ENV}/front/dist"

      - name: Subir dist compilado al VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: front/dist/
          target: /var/www/onez/${{ steps.env.outputs.name }}/front/
          strip_components: 1
          rm: false
          overwrite: true

      - name: Comprobar resultado
        run: |
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then
            echo "::warning::deploy.sh falló en el VPS; se usó dist compilado en GitHub Actions."
          fi
