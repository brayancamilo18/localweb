name: Deploy

on:
  push:
    branches: [main, pre, des]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Determinar entorno
        id: env
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "name=prod" >> "$GITHUB_OUTPUT" ;;
            pre)  echo "name=pre"  >> "$GITHUB_OUTPUT" ;;
            des)  echo "name=des"  >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Rama no válida: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: SSH y deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:            ${{ secrets.VPS_HOST }}
          username:        ${{ secrets.VPS_USER }}
          key:             ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port:            ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script_stop:     true
          request_pty:     false
          script: |
            sudo -n /bin/bash /var/www/onez/deploy.sh ${{ steps.env.outputs.name }}
