name: Deploy

on:
  push:
    branches: [main, pre, des]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Determinar entorno
        id: env
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "name=prod" >> "$GITHUB_OUTPUT" ;;
            pre)  echo "name=pre"  >> "$GITHUB_OUTPUT" ;;
            des)  echo "name=des"  >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Rama no válida para deploy: ${GITHUB_REF_NAME}"
              echo "Ramas permitidas: main, pre, des"
              exit 1
              ;;
          esac

      - name: Deploy en VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:            ${{ secrets.VPS_HOST }}
          username:        ${{ secrets.VPS_USER }}
          key:             ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port:            ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script_stop:     true
          request_pty:     true
          script: |
            set -euo pipefail
            ENV="${{ steps.env.outputs.name }}"
            DEPLOY="/var/www/onez/deploy.sh"

            echo "usuario: $(whoami) uid=$(id -u)"
            echo "entorno: $ENV"

            if [ ! -f "$DEPLOY" ]; then
              echo "No existe $DEPLOY"
              exit 1
            fi

            # root: sudo-rs suele rechazar "sudo" (prueba manual con usuario normal + sudo)
            if [ "$(id -u)" -eq 0 ]; then
              /bin/bash "$DEPLOY" "$ENV"
            else
              sudo -n /bin/bash "$DEPLOY" "$ENV"
            fi
