name: Deploy

on:
  push:
    branches: [main, pre, des]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: front/.nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build frontend (CI)
        run: |
          cd front
          npm ci
          npm run build
          test -f dist/index.html

      - name: Determinar entorno
        id: env
        run: |
          case "${GITHUB_REF_NAME}" in
            main) echo "name=prod" >> "$GITHUB_OUTPUT" ;;
            pre)  echo "name=pre"  >> "$GITHUB_OUTPUT" ;;
            des)  echo "name=des"  >> "$GITHUB_OUTPUT" ;;
          esac

      # Sin sudo: el usuario SSH (secrets.VPS_USER) debe poder ejecutar deploy.sh
      # y escribir en /var/www/onez/{env}/. Si falla, revisar sudoers en el VPS.
      - name: Deploy backend en VPS
        id: deploy_backend
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            ENV="${{ steps.env.outputs.name }}"
            DEPLOY="/var/www/onez/deploy.sh"
            if [ ! -f "$DEPLOY" ]; then
              echo "No existe $DEPLOY"
              exit 1
            fi
            bash "$DEPLOY" "$ENV"

      - name: Preparar carpeta dist (sin sudo)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            ENV="${{ steps.env.outputs.name }}"
            DIST="/var/www/onez/${ENV}/front/dist"
            mkdir -p "$DIST"
            chmod -R u+rwX "$DIST" 2>/dev/null || true

      - name: Subir dist compilado al VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: front/dist/
          target: /var/www/onez/${{ steps.env.outputs.name }}/front/
          strip_components: 1
          rm: false
          overwrite: true

      - name: Comprobar deploy
        if: steps.deploy_backend.outcome != 'success'
        run: |
          echo "::warning::deploy.sh falló en el VPS (¿permisos o Node en el servidor?)."
          echo "El frontend sí se subió desde CI; revisa logs SSH y /var/www/onez/deploy.sh"
